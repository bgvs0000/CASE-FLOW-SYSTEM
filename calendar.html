<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calendar | CaseFlow</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<link rel="stylesheet" href="CSS/shared.css">
<link rel="stylesheet" href="CSS/layout.css">
<link rel="stylesheet" href="CSS/calendar.css">
</head>
<body>

  <div class="app-shell">

    <div id="sidebarMount"></div>
    <header id="topnavMount"></header>

    <main class="main-content">

      <div class="page-heading">
        <div>
          <h1><i class="fa-solid fa-calendar-days"></i> Calendar</h1>
          <p>Case hearings and custom notes in one place.</p>
        </div>
        <button class="btn-primary" id="addNoteBtn">
          <i class="fa-solid fa-note-sticky"></i> Add Note
        </button>
      </div>

      <!-- ===================== CALENDAR TOOLBAR ===================== -->
      <div class="calendar-toolbar">
        <div class="calendar-nav-controls">
          <button class="btn-icon" id="prevMonthBtn" title="Previous month"><i class="fa-solid fa-chevron-left"></i></button>
          <h2 id="calendarMonthLabel">Month Year</h2>
          <button class="btn-icon" id="nextMonthBtn" title="Next month"><i class="fa-solid fa-chevron-right"></i></button>
        </div>
        <button class="btn-outline" id="todayBtn"><i class="fa-solid fa-calendar-day"></i> Today</button>
      </div>

      <!-- ===================== LEGEND ===================== -->
      <div class="calendar-legend">
        <div class="calendar-legend-item">
          <span class="legend-dot legend-hearing"></span> Hearing
        </div>
        <div class="calendar-legend-item">
          <span class="legend-dot legend-note"></span> Note
        </div>
      </div>

      <!-- ===================== CALENDAR GRID ===================== -->
      <div class="calendar-wrapper">
        <div class="calendar-weekdays">
          <div>Sunday</div>
          <div>Monday</div>
          <div>Tuesday</div>
          <div>Wednesday</div>
          <div>Thursday</div>
          <div>Friday</div>
          <div>Saturday</div>
        </div>
        <div class="calendar-grid" id="calendarGrid">
          <!-- Day cells injected by calendar.js -->
        </div>
      </div>

    </main>
  </div>

  <!-- ===================== DAY EVENTS LIST MODAL (hearings + notes for one day) ===================== -->
  <div class="modal-overlay" id="dayHearingsModalOverlay">
    <div class="modal-box glass">
      <div class="modal-header">
        <h2><i class="fa-solid fa-calendar-day"></i> Events — <span id="dayHearingsDateLabel"></span></h2>
        <button class="modal-close" id="closeDayHearingsModal">&times;</button>
      </div>
      <div class="modal-body" id="dayHearingsList">
        <!-- List injected by calendar.js -->
      </div>
    </div>
  </div>

  <!-- ===================== HEARING DETAIL MODAL ===================== -->
  <div class="modal-overlay" id="hearingDetailModalOverlay">
    <div class="modal-box modal-lg glass">
      <div class="modal-header">
        <h2><i class="fa-solid fa-gavel"></i> Hearing Details</h2>
        <button class="modal-close" id="closeHearingDetailModal">&times;</button>
      </div>

      <div class="modal-body">
        <input type="hidden" id="hearingDetailCaseId">
        <input type="hidden" id="hearingDetailHearingId">

        <div class="hearing-detail-grid" id="hearingDetailGrid">
          <!-- Content injected by calendar.js / hearings.js -->
        </div>

        <button class="btn-primary full-width" id="addNextHearingBtn" style="margin-top:20px;">
          <i class="fa-solid fa-plus"></i> Add Next Hearing
        </button>
      </div>
    </div>
  </div>

  <!-- ===================== ADD NEXT HEARING MODAL ===================== -->
  <div class="modal-overlay" id="addHearingModalOverlay">
    <div class="modal-box glass">
      <div class="modal-header">
        <h2><i class="fa-solid fa-calendar-plus"></i> Add Next Hearing</h2>
        <button class="modal-close" id="closeAddHearingModal">&times;</button>
      </div>

      <div class="modal-body">
        <form id="addHearingForm" autocomplete="off">
          <input type="hidden" id="newHearingCaseId">

          <label class="field-label">Hearing Date</label>
          <div class="input-group">
            <i class="fa-solid fa-calendar-days"></i>
            <input type="date" id="newHearingDate" required>
          </div>

          <label class="field-label">Hearing Name</label>
          <div class="input-group">
            <i class="fa-solid fa-heading"></i>
            <input type="text" id="newHearingName" placeholder="e.g. Pre-Trial Conference" required>
          </div>

          <label class="field-label">Notes</label>
          <div class="input-group">
            <i class="fa-solid fa-align-left"></i>
            <textarea id="newHearingNotes" placeholder="Optional notes..."></textarea>
          </div>

          <div id="addHearingError" class="form-error"></div>

          <button type="submit" class="btn-primary full-width">
            <i class="fa-solid fa-floppy-disk"></i> Save Hearing
          </button>
        </form>
      </div>
    </div>
  </div>

  <!-- ===================== ADD / EDIT NOTE MODAL (NEW) ===================== -->
  <div class="modal-overlay" id="noteEditorModalOverlay">
    <div class="modal-box glass">
      <div class="modal-header">
        <h2 id="noteEditorTitle"><i class="fa-solid fa-note-sticky"></i> Add Note</h2>
        <button class="modal-close" id="closeNoteEditorModal">&times;</button>
      </div>

      <div class="modal-body">
        <form id="noteEditorForm" autocomplete="off">
          <input type="hidden" id="noteId">

          <label class="field-label">Date</label>
          <div class="input-group">
            <i class="fa-solid fa-calendar-days"></i>
            <input type="date" id="noteDate" required>
          </div>

          <label class="field-label">Title</label>
          <div class="input-group">
            <i class="fa-solid fa-heading"></i>
            <input type="text" id="noteTitle" placeholder="e.g. Employee One - OUT" required>
          </div>

          <label class="field-label">Description</label>
          <div class="input-group">
            <i class="fa-solid fa-align-left"></i>
            <textarea id="noteDescription" placeholder="Optional details..."></textarea>
          </div>

          <label class="field-label">Image Attachment (optional)</label>
          <div class="input-group">
            <i class="fa-solid fa-image"></i>
            <input type="file" id="noteImageInput" accept="image/*">
          </div>

          <div id="noteImgPreviewWrap" style="display:none; margin-bottom:14px;">
            <img id="noteImgPreview" style="max-width:100%; border-radius:8px;">
            <button type="button" class="btn-outline" id="removeNoteImageBtn" style="margin-top:8px;">
              <i class="fa-solid fa-trash"></i> Remove Image
            </button>
          </div>

          <div id="noteEditorError" class="form-error"></div>

          <button type="submit" class="btn-primary full-width">
            <i class="fa-solid fa-floppy-disk"></i> Save Note
          </button>
        </form>
      </div>
    </div>
  </div>

  <!-- ===================== NOTE DETAIL MODAL (NEW, view/edit/delete) ===================== -->
  <div class="modal-overlay" id="noteDetailModalOverlay">
    <div class="modal-box glass">
      <div class="modal-header">
        <h2><i class="fa-solid fa-note-sticky"></i> <span id="noteDetailTitle"></span></h2>
        <button class="modal-close" id="closeNoteDetailModal">&times;</button>
      </div>

      <div class="modal-body">
        <p class="text-muted" id="noteDetailDate" style="font-size:12px; margin-bottom:14px;"></p>
        <p id="noteDetailDescription" style="font-size:13.5px; line-height:1.6; color:#444; margin-bottom:14px;"></p>
        <div id="noteDetailImageWrap" style="display:none; margin-bottom:14px;">
          <img id="noteDetailImage" style="max-width:100%; border-radius:8px; box-shadow: var(--shadow-soft);">
        </div>
        <p class="text-muted" id="noteDetailMeta" style="font-size:11.5px; margin-bottom:18px;"></p>

        <div class="task-status-actions" id="noteDetailActions">
          <button class="btn-outline" id="editNoteBtn"><i class="fa-solid fa-pen"></i> Edit</button>
          <button class="btn-danger" id="deleteNoteBtn"><i class="fa-solid fa-trash"></i> Delete</button>
        </div>
      </div>
    </div>
  </div>

  <!-- ===================== SCRIPTS ===================== -->
  <script src="JS/storage.js"></script>
  <script src="JS/demo-data.js"></script>
  <script src="JS/auth.js"></script>
  <script src="JS/modal.js"></script>
  <script src="JS/navigation.js"></script>
  <script src="JS/ai-assistant.js"></script>
  <script src="JS/doc-intelligence.js"></script>
  <script src="JS/case-intelligence.js"></script>
  <script src="JS/account.js"></script>
  <script src="JS/bulk-sellect.js"></script>
  <script src="JS/hearings.js"></script>
  <script src="JS/calendar.js"></script>
</body>
</html>
