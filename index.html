<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login | CaseFlow</title>

<!-- Font Awesome -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<!-- Styles -->
<link rel="stylesheet" href="CSS/shared.css">
<link rel="stylesheet" href="CSS/index.css">
</head>
<body>

  <!-- ===================== BACKGROUND ===================== -->
  <div class="login-bg"></div>

  <!-- ===================== LOGIN CONTAINER ===================== -->
  <div class="login-wrapper">
    <div class="login-card glass">

      <div class="brand">
        <img src="IMG/logo.jpg" alt="CaseFlow" class="brand-icon" style="background:none;box-shadow:none;padding:0;object-fit:contain;display:block;width:180px;height:180px;margin-bottom:10px;">
        <h1>CaseFlow <span>Legal Case Management</span></h1>
        <p class="brand-sub">Cases · Clients · Hearings · Documents</p>
      </div>

      <form id="loginForm" class="login-form" autocomplete="off">
        <div class="input-group">
          <i class="fa-solid fa-user"></i>
          <input type="text" id="loginUsername" placeholder="Username or email" required>
        </div>

        <div class="input-group">
          <i class="fa-solid fa-lock"></i>
          <input type="password" id="loginPassword" placeholder="Password" required>
          <i class="fa-solid fa-eye toggle-password" id="toggleLoginPassword"></i>
        </div>

        <div id="loginError" class="form-error"></div>

        <button type="submit" class="btn-primary full-width">
          <i class="fa-solid fa-right-to-bracket"></i> LOGIN
        </button>

        <p style="margin-top:14px; font-size:12px; line-height:1.5; color:var(--color-gray-text);">
          <i class="fa-solid fa-circle-info" style="color:var(--color-gold-dark); margin-right:4px;"></i>
          No account or forgot your password? Please contact the Attorney.
        </p>
      </form>

    </div>

    <div class="login-footer">
      <p>&copy; <span id="currentYear"></span> CaseFlow · Portfolio demo. All rights reserved.</p>
    </div>
  </div>

  <!-- ===================== SCRIPTS ===================== -->
  <script src="JS/storage.js"></script>
  <script src="JS/demo-data.js"></script>
  <script src="JS/auth.js"></script>
  <script src="JS/modal.js"></script>
  <script src="JS/index.js"></script>
</body>
</html>
